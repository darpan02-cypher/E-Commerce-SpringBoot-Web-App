spring.application.name=e-com

server.port=8083


# Database configuration for postgresql 
spring.datasource.url=jdbc:postgresql://localhost:5432/e_com
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
#ORM s/w specific properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurpose12345678901234567890
jwt.expiration-ms=3600000

# Splunk HEC settings (uncomment and set before enabling HEC appender)
# splunk.hec.url=https://localhost:8088
# splunk.hec.token=YOUR_HEC_TOKEN_HERE
# splunk.hec.index=main
# splunk.hec.source=e-com
# splunk.hec.sourcetype=_json

